name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-java-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn -B -pl agones-sdk-java -am verify

  build:
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify

